plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.prasadgaikwad'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
	set('springAiVersion', "2.0.0")
}

dependencies {
    // ─────────────────────────────────────────────
    // Spring Boot Starters
    // ─────────────────────────────────────────────
    // Web starter for REST endpoints (Slack webhook receiver)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Actuator for health checks and observability
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ─────────────────────────────────────────────
    // Slack Bolt SDK
    // The Bolt framework simplifies building Slack apps.
    // - bolt: core event handling and middleware
    // - bolt-servlet: adapts Bolt to run as a Servlet (fits Spring Boot's embedded Tomcat)
    // ─────────────────────────────────────────────
    implementation 'com.slack.api:bolt:1.49.0'
    implementation 'com.slack.api:bolt-jakarta-servlet:1.49.0'

    // ─────────────────────────────────────────────
    // Spring AI
    // ─────────────────────────────────────────────
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'

    implementation 'org.springframework.ai:spring-ai-starter-mcp-client'

    // Vector Store & PGVector
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    runtimeOnly 'org.postgresql:postgresql'

    // ─────────────────────────────────────────────
    // Resiliency
    // ─────────────────────────────────────────────
    implementation 'org.springframework.retry:spring-retry:2.0.13'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.aspectj:aspectjweaver'

    // ─────────────────────────────────────────────
    // Observability
    // ─────────────────────────────────────────────
    // Micrometer Tracing (Boot 4: OpenTelemetry bridge in its own module)
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

    // Prometheus metrics registry (required for the actuator prometheus endpoint)
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // ─────────────────────────────────────────────
    // Testing
    // ─────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-restclient-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
