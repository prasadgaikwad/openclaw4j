# ─────────────────────────────────────────────
# OpenClaw4J — Application Configuration
# ─────────────────────────────────────────────
spring:
  application:
    name: openclaw4j
  profiles:
    active: dev
  main:
    web-application-type: servlet
  
  # Global AI Defaults - Chat provider is selected per profile via
  # spring.ai.model.chat (Spring AI 2.x provider-selection property).
  ai:
    model:
      chat: none
      embedding: ollama
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:any}
      chat:
        model: gpt-4o
    ollama:
      base-url: http://localhost:11434
      chat:
        model: kimi-k2-thinking:cloud
    mcp:
      client:
        stdio:
          connections:
            github:
              command: npx
              args:
                - "-y"
                - "@modelcontextprotocol/server-github"
              env:
                GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN:}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024 # Default for Ollama model kimi-k2-thinking:cloud
        initialize-schema: true
  
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/openclaw4j}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

server:
  port: 8080

# ─────────────────────────────────────────────
# OpenClaw4J Agent Configuration (Common)
# ─────────────────────────────────────────────
openclaw4j:
  channel:
    slack:
      bot-token: ${SLACK_BOT_TOKEN:}
      signing-secret: ${SLACK_SIGNING_SECRET:}
    whatsapp:
      access-token: ${WHATSAPP_ACCESS_TOKEN:}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      verify-token: ${WHATSAPP_VERIFY_TOKEN:}
      api-version: v21.0
    console:
      enabled: ${CONSOLE_ENABLED:false}
  rag:
    enabled: true
    channels: ${SLACK_CHANNEL_IDS:}
  tools:
    github:
      token: ${GITHUB_TOKEN:}
      owner: ${GITHUB_OWNER:}
      repo: ${GITHUB_REPO:}
    search:
      api-key: ${TAVILY_API_KEY:}
      enabled: ${SEARCH_ENABLED:false}
      base-url: ${TAVILY_BASE_URL:https://api.tavily.com}
      api-path: ${TAVILY_API_PATH:/search}
      search-depth: ${TAVILY_SEARCH_DEPTH:basic}
      include-answer: ${TAVILY_INCLUDE_ANSWER:true}
      max-results: ${TAVILY_MAX_RESULTS:5}

# ─────────────────────────────────────────────
# Actuator — Health & Monitoring
# ─────────────────────────────────────────────
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        all: true
  endpoint:
    health:
      show-details: always

# ─────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────
logging:
  level:
    dev.prasadgaikwad.openclaw4j: DEBUG
    com.slack.api: INFO
    org.springframework.ai: INFO

---
# ─────────────────────────────────────────────
# Profile: openai (Default startup profile)
# ─────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: openai
  ai:
    model:
      chat: openai

---
# ─────────────────────────────────────────────
# Profile: ollama
# ─────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: ollama
  ai:
    model:
      chat: ollama
